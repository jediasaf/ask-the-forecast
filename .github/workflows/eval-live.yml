name: Live eval

# The real thing: runs the agent against the question sets and rewrites the
# failure analysis. It calls a paid API, so it never runs on push. Trigger it
# by hand after a change to the agent, the prompt, or the tools.
#
# Needs repository secret ANTHROPIC_API_KEY.

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Model id (blank uses the repo default)"
        required: false
        type: string
      limit:
        description: "Only run the first N questions (blank runs all)"
        required: false
        type: string

jobs:
  eval:
    name: score the agent
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run eval
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.model }}" ]; then ARGS="$ARGS --model ${{ inputs.model }}"; fi
          if [ -n "${{ inputs.limit }}" ]; then ARGS="$ARGS --limit ${{ inputs.limit }}"; fi
          python -m eval.run_eval $ARGS

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: |
            eval/results.md
            eval/results.json
          if-no-files-found: warn
