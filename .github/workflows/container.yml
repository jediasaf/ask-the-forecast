name: Container

# Build the image, prove it works, deploy it to a real Kubernetes cluster, prove
# that works, and only then publish. Free and deterministic like CI: the server
# holds no model and needs no key.
#
# The same smoke test runs at both stages. It speaks MCP to the server, lists
# the tools and makes a real call, so "healthy" means the tools answer, not that
# a port is open.

on:
  push:
    branches: [main]
    paths:
      - "agent/**"
      - "mcp_server/**"
      - "data/**"
      - "deploy/**"
      - "scripts/smoke_mcp_http.py"
      - "Dockerfile"
      - ".dockerignore"
      - "pyproject.toml"
      - ".github/workflows/container.yml"
  pull_request:
  workflow_dispatch:

env:
  IMAGE: ghcr.io/jediasaf/ask-the-forecast-mcp

jobs:
  build-test-deploy:
    name: build, smoke test, deploy to kind
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image runs as a non-root user
        run: |
          uid=$(docker run --rm --entrypoint id "$IMAGE:$GITHUB_SHA" -u)
          echo "container uid: $uid"
          test "$uid" != "0"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the smoke test client
        run: pip install "mcp>=2" "anthropic>=1.1.0" "pydantic>=2.0"

      - name: Smoke test the container
        run: |
          docker run -d --name mcp -p 8000:8000 --read-only \
            -e MCP_ALLOWED_HOSTS=localhost:8000,127.0.0.1:8000 \
            "$IMAGE:$GITHUB_SHA"
          for i in $(seq 1 30); do
            curl -fs http://127.0.0.1:8000/healthz && break
            sleep 1
          done
          python -m scripts.smoke_mcp_http http://127.0.0.1:8000
          docker logs mcp | tail -5
          docker rm -f mcp

      - name: Create a Kubernetes cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: forecast

      - name: Deploy to the cluster
        run: |
          kind load docker-image "$IMAGE:$GITHUB_SHA" --name forecast
          cd deploy/k8s
          kustomize edit set image "$IMAGE=$IMAGE:$GITHUB_SHA"
          kubectl apply -k .
          kubectl -n forecast rollout status deployment/ask-the-forecast-mcp --timeout=120s
          kubectl -n forecast get pods -o wide

      - name: Smoke test through the Service
        run: |
          kubectl -n forecast port-forward service/ask-the-forecast-mcp 8000:8000 &
          for i in $(seq 1 30); do
            curl -fs http://127.0.0.1:8000/healthz && break
            sleep 1
          done
          python -m scripts.smoke_mcp_http http://localhost:8000

      - name: A rolling restart keeps the Service answering
        run: |
          kubectl -n forecast rollout restart deployment/ask-the-forecast-mcp
          kubectl -n forecast rollout status deployment/ask-the-forecast-mcp --timeout=120s
          # The earlier port-forward was bound to a pod that no longer exists.
          pkill -f "port-forward" || true
          kubectl -n forecast port-forward service/ask-the-forecast-mcp 8000:8000 &
          for i in $(seq 1 30); do
            curl -fs http://127.0.0.1:8000/healthz && break
            sleep 1
          done
          python -m scripts.smoke_mcp_http http://localhost:8000

      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl -n forecast describe deployment/ask-the-forecast-mcp || true
          kubectl -n forecast get events --sort-by=.lastTimestamp | tail -30 || true
          kubectl -n forecast logs -l app.kubernetes.io/name=ask-the-forecast-mcp --tail=50 || true

      - name: Log in to the registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the image that passed
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag "$IMAGE:$GITHUB_SHA" "$IMAGE:latest"
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:latest"
